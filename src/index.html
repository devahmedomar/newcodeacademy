<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>New Code Academy — Student Portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script>
    try {
      var l = localStorage.getItem('nca_lang');
      if (l === 'en') {
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <script>
    try {
      var t = localStorage.getItem('nca_theme');
      var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) {
        document.body.classList.add('dark-mode');
        document.documentElement.style.colorScheme = 'dark';
      }
    } catch (e) {}
  </script>
  <app-root></app-root>
  <div id="p-license-host" style="display:none" aria-hidden="true"></div>
</body>
</html>
