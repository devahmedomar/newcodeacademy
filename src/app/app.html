<div class="app-shell">
  @if (auth.isStudent()) {
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">New Code Academy</div>
        <div class="user-row">
          <span class="user-name">{{ auth.user()?.name }}</span>
          <button class="btn btn-sm btn-outline" style="color:#fff;border-color:rgba(255,255,255,0.25)" (click)="logout()">Logout</button>
        </div>
      </div>
    </header>
    <nav class="bottom-nav">
      <a routerLink="/dashboard" routerLinkActive="active">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </a>
      <a routerLink="/lessons" routerLinkActive="active">
        <span class="nav-icon">🎬</span>
        <span>Lessons</span>
      </a>
      <a routerLink="/grades" routerLinkActive="active">
        <span class="nav-icon">📊</span>
        <span>Grades</span>
      </a>
      <a routerLink="/payments" routerLinkActive="active">
        <span class="nav-icon">💳</span>
        <span>Payments</span>
      </a>
    </nav>
  }
  <main class="container">
    <router-outlet />
  </main>
</div>
