<div class="auth-wrap">
  <div class="lang-corner">
    <p-button [text]="true" [rounded]="true" icon="pi pi-globe"
              [label]="i18n.lang() === 'ar' ? 'EN' : 'العربية'"
              [pTooltip]="i18n.t('app.switchLang')" (onClick)="i18n.toggle()" />
    <p-button [text]="true" [rounded]="true"
              [icon]="theme.isDark() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
              [pTooltip]="i18n.t('app.toggleDark')" (onClick)="theme.toggle()" />
  </div>

  <div class="auth-aside">
    <div class="brand">
      <i class="pi pi-graduation-cap"></i>
      <span>New Code Academy</span>
    </div>
    <h1>{{ i18n.t('login.tagline') }}</h1>
    <p>{{ i18n.t('login.sub') }}</p>
    <ul class="feature-list">
      <li><i class="pi pi-video"></i> {{ i18n.t('login.f1') }}</li>
      <li><i class="pi pi-chart-bar"></i> {{ i18n.t('login.f2') }}</li>
      <li><i class="pi pi-bolt"></i> {{ i18n.t('login.f3') }}</li>
    </ul>
  </div>

  <div class="auth-main">
    <div class="mobile-brand">
      <span class="mobile-brand-mark"><i class="pi pi-graduation-cap"></i></span>
      <span class="mobile-brand-name">New Code Academy</span>
    </div>
    <p-card class="auth-card">
      <ng-template #title>
        <div class="auth-card-title">
          <h1>{{ i18n.t('login.title') }}</h1>
          <p>{{ i18n.t('login.welcome') }}</p>
        </div>
      </ng-template>
      <form (ngSubmit)="submit()">
        @if (error) {
          <div class="auth-error" aria-live="polite">
            <p-message severity="error" class="w-full mb-3">{{ error }}</p-message>
          </div>
        }
        <div class="field">
          <p-floatlabel>
            <input pInputText id="email" type="email" [(ngModel)]="email" name="email" required
                   autocomplete="email" class="w-full" />
            <label for="email">{{ i18n.t('login.email') }}</label>
          </p-floatlabel>
        </div>
        <div class="field">
          <p-floatlabel>
            <p-password id="password" [(ngModel)]="password" name="password" required
                        [feedback]="false" [toggleMask]="true" autocomplete="current-password" class="w-full" />
            <label for="password">{{ i18n.t('login.password') }}</label>
          </p-floatlabel>
        </div>
        <p-button type="submit" [label]="loading ? i18n.t('login.signingin') : i18n.t('login.signin')"
                  [loading]="loading" [icon]="arrowIcon()" iconPos="right" styleClass="w-full" />
      </form>
      </p-card>
  </div>
</div>
