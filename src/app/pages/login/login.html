<div class="auth-wrap">
  <form class="auth-card" (ngSubmit)="submit()">
    <div class="logo">🎓</div>
    <h1>New Code Academy</h1>
    <p class="sub">Student portal — sign in</p>

    @if (error) {
      <div class="alert alert-error">{{ error }}</div>
    }

    <div class="form-row">
      <label class="label" for="email">Email</label>
      <input class="input" id="email" type="email" [(ngModel)]="email" name="email" required autocomplete="email" />
    </div>
    <div class="form-row">
      <label class="label" for="password">Password</label>
      <input class="input" id="password" type="password" [(ngModel)]="password" name="password" required autocomplete="current-password" />
    </div>

    <button class="btn" type="submit" style="width:100%" [disabled]="loading">
      {{ loading ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
